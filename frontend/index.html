<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentForge — AI Agent Generator</title>
    <meta name="description" content="Generate production-ready AI agents from natural language" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- ═══════════ AUTH OVERLAY ═══════════ -->
    <div id="authOverlay" class="auth-overlay">
      <div class="auth-card">
        <div class="auth-brand">
          <div class="auth-logo">A</div>
          <h1>AgentForge</h1>
          <p>Generate AI agents from natural language</p>
        </div>

        <div id="authTabs" class="auth-tabs">
          <button class="auth-tab active" data-auth-tab="login">Sign In</button>
          <button class="auth-tab" data-auth-tab="signup">Create Account</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form active" data-auth-form="login">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password" />
          </div>
          <div id="loginError" class="form-error"></div>
          <button type="submit" class="btn btn-auth">Sign In</button>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" class="auth-form" data-auth-form="signup">
          <div class="form-group">
            <label for="signupUsername">Username</label>
            <input type="text" id="signupUsername" placeholder="Choose a username" required minlength="3" maxlength="30" autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="signupEmail">Email</label>
            <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password" />
          </div>
          <div id="signupError" class="form-error"></div>
          <button type="submit" class="btn btn-auth">Create Account</button>
        </form>
      </div>
    </div>

    <!-- ═══════════ MAIN APP ═══════════ -->
    <div id="appShell" class="app hidden">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo">A</div>
          <div class="brand-text">
            <div class="brand-title">AgentForge</div>
            <div class="brand-subtitle">Pipeline UI</div>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="section-title">History</div>
          <div id="history" class="history"></div>
        </div>

        <div class="sidebar-section compact">
          <div class="section-title">Result Report</div>
          <div class="report-switcher">
            <button class="report-btn active" data-report-view="summary">Summary</button>
            <button class="report-btn" data-report-view="verifier">Verifier JSON</button>
            <button class="report-btn" data-report-view="attempts">Attempts</button>
          </div>
          <div class="score-box">
            <div class="score-label">Verified Score</div>
            <div id="verifiedScore" class="score-value">--</div>
          </div>
        </div>

        <div class="sidebar-footer">
          <div class="user-info" id="userInfo">
            <span class="user-avatar" id="userAvatar">?</span>
            <span class="user-name" id="userName">User</span>
            <button id="btnLogout" class="btn btn-ghost btn-sm">Logout</button>
          </div>
          <div id="serverStatus" class="status-pill">
            <span class="dot"></span>
            <span class="label">Server</span>
            <span class="value">…</span>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-left">
            <div class="title">Agent Pipeline</div>
            <div class="subtitle">Describe your agent or ask a question</div>
          </div>
          <div class="topbar-right">
            <button id="btnClear" class="btn btn-ghost">Clear</button>
          </div>
        </header>

        <section class="content">
          <div class="panel panel-chat">
            <div class="panel-header">
              <div class="panel-title">Conversation</div>
              <div class="panel-meta" id="routeBadge"></div>
            </div>

            <div id="chat" class="chat"></div>

            <div class="composer">
              <textarea
                id="prompt"
                rows="3"
                placeholder="Ask a question, or say: Build me an agent that…"
                maxlength="5000"
              ></textarea>
              <div class="composer-bar">
                <div class="counter" id="counter">0 / 5000</div>
                <button id="btnTerminate" class="btn btn-danger">Terminate</button>
                <button id="btnRun" class="btn btn-primary">Run</button>
              </div>
            </div>
          </div>

          <div class="panel panel-right">
            <div class="panel-header">
              <div class="panel-title">Pipeline</div>
              <div class="panel-meta" id="pipelineStatus">Idle</div>
            </div>

            <div id="pipeline" class="pipeline"></div>

            <div class="divider"></div>

            <div class="panel-header">
              <div class="panel-title">Artifacts</div>
              <div class="panel-meta">Preview</div>
            </div>

            <div class="tabs">
              <button class="tab active" data-tab="report">Report</button>
              <button class="tab" data-tab="agent">agent.py</button>
              <button class="tab" data-tab="main">main.py</button>
              <button class="tab" data-tab="requirements">requirements.txt</button>
              <button class="tab" data-tab="readme">README.md</button>
              <button class="tab" data-tab="spec">Spec JSON</button>
            </div>

            <div class="tabpanes">
              <div class="pane active" data-pane="report"><pre id="outReport"></pre></div>
              <div class="pane" data-pane="agent"><pre id="outAgent"></pre></div>
              <div class="pane" data-pane="main"><pre id="outMain"></pre></div>
              <div class="pane" data-pane="requirements"><pre id="outReq"></pre></div>
              <div class="pane" data-pane="readme"><pre id="outReadme"></pre></div>
              <div class="pane" data-pane="spec">
                <div class="spec-toolbar">
                  <button id="btnConfirmSpec" class="btn btn-primary">Confirm JSON & Generate</button>
                </div>
                <textarea id="outSpec" rows="20" spellcheck="false" placeholder="Agent specification JSON" title="Editable agent specification JSON"></textarea>
              </div>
            </div>
          </div>
        </section>

        <div id="toastHost" class="toasts"></div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
