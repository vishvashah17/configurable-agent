services:
  - type: web
    name: agentforge
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --timeout 300 --workers 2 --threads 4
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CONTENT_GUARD_ENABLED
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: AUTH_SECRET_KEY
        generateValue: true
